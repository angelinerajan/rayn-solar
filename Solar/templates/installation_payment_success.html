<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Rayn Solar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        :root {
            /* SIGNATURE RAYN SOLAR PALETTE */
            --bg1: #300305;       /* Deep luxurious burgundy */
            --bg2: #141824;       /* Twilight midnight blue */
            --bg-mid: #0f111a;    /* Deep slate canvas base */
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            
            --primary: #8b5cf6;    /* Signature Purple Brand Accent */
            --primary-gradient: linear-gradient(135deg, #7c3aed, #8b5cf6);
            --text-main: #e6e8ee; 
            --text-muted: #9aa0b4;
            --success: #22c55e;
            --success-glow: rgba(34, 197, 94, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: 
                radial-gradient(circle at top, var(--bg2), transparent 60%),
                linear-gradient(to bottom, var(--bg2) 0%, var(--bg1) 25%, var(--bg-mid) 50%, var(--bg-mid) 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .success-card {
            background: rgba(15, 17, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .checkmark-wrapper {
            width: 74px;
            height: 74px;
            background-color: var(--success-glow);
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
            border: 1px solid rgba(34, 197, 94, 0.25);
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            color: #ffffff;
            margin: 0 0 12px;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .receipt-box {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 28px;
            text-align: left;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .receipt-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            margin-top: 12px;
        }

        .label {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .value {
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-home {
            display: block;
            background: var(--primary-gradient);
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.98rem;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.15);
        }

        .btn-home:hover {
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
            transform: translateY(-1px);
        }

        .btn-home:active {
            transform: scale(0.99);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="checkmark-wrapper">
        <i class="fas fa-check"></i>
    </div>
    <h2>Payment Successful</h2>
    <p>Thank you! Your installation transaction processing steps are complete. Your panel profile summary dashboard has been updated.</p>

    <div class="receipt-box">
        <div class="receipt-row">
            <span class="label">Payment Status</span>
            <span class="value" style="color: var(--success);"><i class="fas fa-circle-check" style="margin-right: 4px;"></i> Completed</span>
        </div>
        <div class="receipt-row">
            <span class="label">Transaction ID</span>
            <span class="value">#{{ payment.id|default:"N/A" }}</span>
        </div>
        <div class="receipt-row">
            <span class="label">Amount Paid</span>
            <span class="value" style="color: #ffffff; font-weight: 700;">₹{{ payment.amount }}</span>
        </div>
    </div>

    <div class="action-buttons">
        <a href="{% url 'view_installation_receipt' payment.id %}" target="_blank" class="btn-secondary">
            <i class="fas fa-file-arrow-down"></i> Download Receipt
        </a>
        
        <a href="{% url 'installation_history' %}" class="btn-home">
            Go to Installation History
        </a>
    </div>
</div>

<script>
    // CRITICAL: Block browsing history traversal tracking completely
    (function secureHistoryStates() {
        // Drop an anchor point explicitly 
        window.history.pushState(null, "", window.location.href);
        
        // Intercept browser back navigation directly and force push forward to main home layout view
        window.onpopstate = function() {
            window.location.replace("{% url 'installation_history' %}"); 
        };
    })();
</script>
</body>
</html>
