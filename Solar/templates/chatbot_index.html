<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayn Solar |  Ray ☀️</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0f172a;
    --accent-solar: #fbbf24; 
    --msg-bot: #1e293b;
    --msg-user: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
    --glass-bg: rgba(30, 41, 59, 0.7);
    --text-main: #f1f5f9;
  }

  body, html {
    height: 100%;
    margin: 0;
    background: var(--bg-dark);
    /* Tech grid pattern */
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  #chatbot-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 95%;
    max-width: 900px;
    height: 85vh;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  #chatbot-header {
    background: rgba(15, 23, 42, 0.9);
    padding: 20px 30px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #chatbot-header h5 {
    margin: 0;
    font-weight: 700;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    background-clip: text; /* Standard version */
    -webkit-text-fill-color: transparent;
  }

  #chatbot-messages {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .message {
    max-width: 75%;
    padding: 14px 20px;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    animation: slideUp 0.3s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    background: var(--msg-user);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    background: var(--msg-bot);
    color: var(--text-main);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .chat-input-container {
    padding: 20px 30px;
    background: rgba(15, 23, 42, 0.95);
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .chat-input {
    flex: 1;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 10px 18px;
    color: white;
    outline: none;
  }

  .chat-input:focus { border-color: #38bdf8; }

  .action-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    transition: 0.2s;
    font-weight: bold;
  }

  .send-button { background: var(--accent-solar); color: #0f172a; }
  .speech-button { background: #334155; color: white; }
  .stop-button { background: #ef4444; color: white; }
  
  .action-btn:hover { transform: scale(1.05); }

  #close-chatbot { color: #94a3b8; background: none; border: none; font-size: 24px; }
</style>
</head>
<body>

<div id="chatbot-container">
  <div id="chatbot-header">
    <div>
      <h5>Ray</h5>
      <small style="color: #94a3b8;">Rayn Solar</small>
    </div>
    <button id="close-chatbot">&times;</button>
  </div>

  <div id="chatbot-messages">
    <div class="message bot">Hello, I am Ray. Welcome to Rayn Solar. How may I assist you today?</div>
  </div>

  <div class="chat-input-container">
    <button id="speech-chat" class="action-btn speech-button">🎤</button>
    <input id="chat-input" class="chat-input" type="text" placeholder="Send a message..." />
    <button id="stop-speech" class="action-btn stop-button">⏹</button>
    <button id="send-chat" class="action-btn send-button">➤</button>
  </div>
</div>

<script>
  const closeButton = document.getElementById('close-chatbot');
  const sendButton = document.getElementById('send-chat');
  const speechButton = document.getElementById('speech-chat');
  const stopButton = document.getElementById('stop-speech');
  const chatInput = document.getElementById('chat-input');
  const chatbotMessages = document.getElementById('chatbot-messages');

  let synth = window.speechSynthesis;

  closeButton.addEventListener('click', () => { window.location.href = '/'; });

  function sendMessage() {
    const userMessage = chatInput.value.trim();
    if(!userMessage) return;

    displayMessage(userMessage, 'user');
    chatInput.value = '';

    fetch('/chatbot_index/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}'
      },
      body: JSON.stringify({ message: userMessage })
    })
    .then(res => res.json())
    .then(data => {
      displayMessage(data.response, 'bot');
      speakText(data.response);
    })
    .catch(err => displayMessage('Error: Connection lost.', 'bot'));
  }

  function displayMessage(message, sender){
    // Clean up markdown for display
    const cleanMessage = message.replace(/[*#]/g, '');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.textContent = cleanMessage;

    chatbotMessages.appendChild(msgDiv);
    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
  }

  function speakText(text){
    if(synth.speaking) synth.cancel();
    
    // Clean text for speech engine (no emojis or stars)
    let speechBuffer = text.replace(/[*#]/g, '');
    speechBuffer = speechBuffer.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');

    const utterance = new SpeechSynthesisUtterance(speechBuffer);
    utterance.lang = 'en-US';
    synth.speak(utterance);
  }

  sendButton.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });

  speechButton.addEventListener('click', () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert('Not supported');
    const recognition = new SpeechRecognition();
    recognition.start();
    recognition.onresult = (event) => {
      chatInput.value = event.results[0][0].transcript;
      sendMessage();
    }
  });

  stopButton.addEventListener('click', () => synth.cancel());
</script>
</body>
</html>
