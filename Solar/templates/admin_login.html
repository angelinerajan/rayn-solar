<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayn Solar | Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            /* ECO-TECH THEME */
            --bg-top: #0a1128;
            --bg-bottom: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f9fafb;
            --muted: #9ca3af;
            
            /* DYNAMIC ACCENTS */
            --accent: #10b981;
            --accent2: #06b6d4;
            --accent-orange: #f59e0b; /* Using this to make the popup stand out */
            
            --btn-gradient: linear-gradient(135deg, var(--accent), var(--accent2));
            --text-gradient: linear-gradient(135deg, #ffffff, var(--accent2));

            /* THE POPUP THEME (Stands out intentionally from the deep slate body) */
            --popup-bg: #111827; 
            --popup-border: rgba(245, 158, 11, 0.2); /* Subtle orange warning/alert tint */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, var(--bg-top), var(--bg-bottom));
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow-x: hidden;
        }

        #glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(700px circle at var(--x) var(--y), rgba(6, 182, 212, 0.04), transparent 80%);
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .login-container:hover {
            border-color: var(--accent2);
            box-shadow: 0 25px 50px rgba(6, 182, 212, 0.05);
        }

        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .admin-header h2 span {
            background: var(--text-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-header p {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 8px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            color: var(--text-main);
            background-color: rgba(2, 6, 23, 0.5);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        input:focus {
            outline: none;
            border-color: var(--accent2);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.15);
            background-color: rgba(2, 6, 23, 0.8);
        }

        .input-icon {
            position: absolute;
            top: 36px;
            left: 15px;
            color: var(--muted);
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.25s ease;
        }

        .form-group input:focus ~ .input-icon {
            color: var(--accent2);
        }

        button.btn-submit {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 14px;
            color: #022c22;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button.btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.3);
            filter: brightness(1.05);
        }

        .back-floating {
            position: fixed;
            left: 32px;
            top: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 999px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            z-index: 1000;
        }

        .back-floating:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent2);
            transform: translateX(-2px);
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
        }

        /* CUSTOM MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.7); /* Darker overlay backdrop */
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .browser-popup {
            background-color: var(--popup-bg);
            width: 90%;
            max-width: 420px;
            border-radius: 20px;
            padding: 32px;
            border: 1px solid var(--popup-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 158, 11, 0.05);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }

        .modal-overlay.active .browser-popup {
            transform: scale(1);
        }

        /* Modernized Status Icon Badge */
        .popup-icon-badge {
            width: 56px;
            height: 56px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: var(--accent-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 20px auto;
        }

        .browser-popup h3 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .browser-popup p {
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .popup-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .popup-btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            flex: 1;
        }

        .popup-btn.primary {
            background: linear-gradient(135deg, var(--accent-orange), #d97706);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }

        .popup-btn.primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .popup-btn.secondary {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .popup-btn.secondary:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 768px) {
            .back-floating { left: 16px; top: 20px; padding: 8px 14px; font-size: 13px; }
            .login-container { padding: 35px 25px; margin: 20px; }
        }
    </style>
</head>

<body>

<div id="glow"></div>

<a href="/" class="back-floating">
    <i class="fas fa-arrow-left"></i>
    <span>Back to Portal</span>
</a>

<div id="auth-context" data-success="{% if success_login %}true{% else %}false{% endif %}" style="display: none;"></div>

<div class="login-container">
    <div class="admin-header">
        <h2>Admin <span>Panel</span></h2>
        <p>Rayn Solar Management System</p>
    </div>

    {% if error_msg %}
    <div class="error-banner">
        <i class="fas fa-exclamation-circle"></i> {{ error_msg }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Official ID</label>
            <input type="text" name="official_id" placeholder="Enter administrative ID" required>
            <i class="fas fa-user-shield input-icon"></i>
        </div>

        <div class="form-group">
            <label>Secure Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
            <i class="fas fa-lock input-icon"></i>
        </div>

        <button type="submit" class="btn-submit">Verify & Access</button>
    </form>
</div>

<div class="modal-overlay" id="successModal">
    <div class="browser-popup">
        <div class="popup-icon-badge">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h3>Login Successful</h3>
        <p>Your administrative session has been successfully verified. Ready to access the Rayn Solar management dashboard?</p>
        <div class="popup-actions">
            <button class="popup-btn secondary" onclick="closeModal()">Cancel</button>
            <button class="popup-btn primary" onclick="proceedToDashboard()">Enter Dashboard</button>
        </div>
    </div>
</div>

<script>
    // Dynamic tracking background glow
    document.addEventListener('mousemove', (e) => {
        document.documentElement.style.setProperty('--x', e.clientX + 'px');
        document.documentElement.style.setProperty('--y', e.clientY + 'px');
    });

    // Read the safe HTML context data attribute instead of executing raw Django template conditions inside JS
    const authContext = document.getElementById('auth-context');
    if (authContext && authContext.getAttribute('data-success') === 'true') {
        document.getElementById('successModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('successModal').classList.remove('remove');
        document.getElementById('successModal').classList.remove('active');
    }

    function proceedToDashboard() {
        window.location.href = "{% url 'admin_dashboard' %}";
    }
</script>

</body>
</html>
