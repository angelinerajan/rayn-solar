<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>

<style>
    :root {
        /* REBALANCED THEME: Midnight Blue dominant, Burgundy only as deep subtle shadow */
        --bg-primary: #141824;      /* Main base background */
        --bg-deep-shadow: #250204;  /* Deep burgundy shadow (for gradient bottom only) */
        
        --card: rgba(255,255,255,0.04);
        --border: rgba(255,255,255,0.08);
        --text: #e6e8ee;
        --muted: #9aa0b4;
        --accent: #8b5cf6;
        --danger: #f87171;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", sans-serif;
        /* Rebalanced background: Midnight blue dominant, grounded by subtle deep warmth at the base */
        background: 
            radial-gradient(circle at top, #1e253a, transparent 60%),
            linear-gradient(to bottom, var(--bg-primary) 0%, var(--bg-primary) 60%, var(--bg-deep-shadow) 100%);
        background-attachment: fixed;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .container {
        width: 100%;
        max-width: 640px;
        background: var(--card);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 38px 40px;
        border: 1px solid var(--border);
        box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }

    h2 {
        margin: 0 0 35px;
        font-weight: 500;
        letter-spacing: 0.4px;
        text-align: center;
    }

    .profile-photo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 30px;
    }

    .profile-photo img {
        width: 118px;
        height: 118px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
        border: 2px solid var(--border);
    }

    input[type="file"] {
        font-size: 12px;
        color: var(--muted);
        border: none;
        background: none;
    }

    .form-group {
        margin-bottom: 22px;
    }

    label {
        font-size: 12px;
        letter-spacing: 0.5px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        padding: 10px 2px;
        font-size: 14px;
        color: var(--text);
        transition: 0.3s;
    }

    input:focus {
        outline: none;
        border-bottom-color: var(--accent);
    }

    /* Fixed Readonly Styling: Removed heavy gray, neutralized to blend with Midnight Blue */
    input[readonly] {
        color: var(--muted);
        cursor: not-allowed;
        border-bottom: 1px dashed var(--border);
        background: rgba(255, 255, 255, 0.01) !important;
    }

    small {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
    }

    .error {
        font-size: 12px;
        color: var(--danger);
        margin-top: 6px;
    }

    .btn {
        width: 100%;
        margin-top: 30px;
        padding: 14px;
        background: linear-gradient(135deg, #7c3aed, #8b5cf6);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.35s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(139,92,246,0.35);
    }

    .cancel-link {
        display: block;
        margin-top: 22px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        transition: 0.25s ease;
    }

    .cancel-link:hover {
        color: var(--text);
    }
</style>

</head>

<body>

<div class="container">
    <h2>Edit Profile</h2>

    <form method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
        {% csrf_token %}

        <div class="profile-photo">
            {% if user.photo %}
                <img src="{{ user.photo.url }}" alt="Profile Photo">
            {% endif %}
            <input type="file" name="photo">
        </div>

        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}">
            <div class="error" id="nameError"></div>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email"
                id="email"
                name="email"
                value="{{ user.email }}"
                readonly
                tabindex="-1"
                style="background:#f1f1f1; cursor:not-allowed;">
                <small style="color:#777; font-size:12px;">
                    Email address cannot be changed
                </small>
                {% comment %} <small style="color:#555; font-size:12px;">
                    Need to change your email? Please contact support.
                </small> {% endcomment %}

        </div>


        <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" id="phone" name="phone_number" value="{{ user.phone_number }}">
            <div class="error" id="phoneError"></div>
        </div>

        <div class="form-group">
            <label>Street Address *</label>
            <input type="text" id="street" name="street_address" value="{{ user.street_address }}">
            <div class="error" id="streetError"></div>
        </div>

        <div class="form-group">
            <label>City *</label>
            <input type="text" id="city" name="city" value="{{ user.city }}">
            <div class="error" id="cityError"></div>
        </div>

        <div class="form-group">
            <label>State *</label>
            <input type="text" id="state" name="state" value="{{ user.state }}">
            <div class="error" id="stateError"></div>
        </div>

        <div class="form-group">
            <label>Pincode *</label>
            <input type="text" id="pincode" name="pincode" value="{{ user.pincode }}">
            <div class="error" id="pincodeError"></div>
        </div>

        <div class="form-group">
            <label>Country *</label>
            <input type="text" id="country" name="country" value="{{ user.country }}">
            <div class="error" id="countryError"></div>
        </div>

        <button type="submit" class="btn">Update Profile</button>
    </form>

    <a href="{% url 'user_profile' %}" class="cancel-link">Cancel</a>
</div>

<script>
function validateForm() {
    let isValid = true;

    // Clear errors
    document.querySelectorAll('.error').forEach(e => e.innerText = '');

    const name = document.getElementById("full_name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const street = document.getElementById("street").value.trim();
    const city = document.getElementById("city").value.trim();
    const state = document.getElementById("state").value.trim();
    const pincode = document.getElementById("pincode").value.trim();
    const country = document.getElementById("country").value.trim();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phonePattern = /^[6-9]\d{9}$/;   // Indian phone number
    const pincodePattern = /^\d{6}$/;

    if (name === "") {
        document.getElementById("nameError").innerText = "Full name is required";
        isValid = false;
    }


    if (!phonePattern.test(phone)) {
        document.getElementById("phoneError").innerText = "Enter a valid 10-digit phone number";
        isValid = false;
    }

    if (street === "") {
        document.getElementById("streetError").innerText = "Street address is required";
        isValid = false;
    }

    if (city === "") {
        document.getElementById("cityError").innerText = "City is required";
        isValid = false;
    }

    if (state === "") {
        document.getElementById("stateError").innerText = "State is required";
        isValid = false;
    }

    if (!pincodePattern.test(pincode)) {
        document.getElementById("pincodeError").innerText = "Enter a valid 6-digit pincode";
        isValid = false;
    }

    if (country === "") {
        document.getElementById("countryError").innerText = "Country is required";
        isValid = false;
    }

    return isValid;
}
</script>

</body>
</html>
