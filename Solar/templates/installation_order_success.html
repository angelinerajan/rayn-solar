<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Rayn Solar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        :root {
            /* SIGNATURE RAYN SOLAR PALETTE (MATCHED TO HOME) */
            --bg1: #300305;       /* Deep luxurious burgundy */
            --bg2: #141824;       /* Twilight midnight blue */
            --bg-mid: #0f111a;    /* Deep slate canvas base */
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            
            --primary: #8b5cf6;    /* Signature Purple Brand Accent */
            --primary-gradient: linear-gradient(135deg, #7c3aed, #8b5cf6);
            --text-main: #e6e8ee; 
            --text-muted: #9aa0b4;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            /* Balanced Multi-gradient background mapped to user home core canvas */
            background: 
                radial-gradient(circle at top, var(--bg2), transparent 60%),
                linear-gradient(to bottom, var(--bg2) 0%, var(--bg1) 25%, var(--bg-mid) 50%, var(--bg-mid) 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .checkout-container {
            background: rgba(15, 17, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        #loader {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 17, 26, 0.98);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .header {
            padding: 30px 24px;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .header h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .amount-badge { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #ffffff; 
            letter-spacing: -0.5px;
        }

        .form-content { padding: 28px 24px; }

        .method-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 14px;
            background: var(--card);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hover effect indicating clear interactive structural zones */
        .method-card:hover {
            border-color: rgba(139, 92, 246, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Distinct styling block for when the radio variant is selected */
        .method-card.active-method {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.04);
        }

        .method-label {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            gap: 14px;
            font-size: 0.98rem;
        }

        .method-label input[type="radio"] {
            margin: 0;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .method-label i {
            color: var(--text-muted);
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            transition: color 0.2s;
        }

        .method-card.active-method .method-label i {
            color: var(--primary);
        }

        .details-area {
            display: none;
            padding: 0 20px 20px 52px; /* Margins flush along the text boundary */
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.15);
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .cancel-link:hover {
            color: var(--text-main);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 18px; font-weight: 600; letter-spacing: -0.2px;">Authenticating Transaction...</p>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Please wait, do not refresh or go back.</p>
    </div>

    <div class="header">
        <h3>Payable Amount</h3>
        <div class="amount-badge">₹{{ payment.amount }}</div>
    </div>

    <div class="form-content">
        <form id="paymentForm" method="POST" action="{% url 'confirm_installation_payment' payment.id %}">
            {% csrf_token %}
            
            <div class="method-card active-method" id="card-upi">
                <label class="method-label">
                    <input type="radio" name="payment_method" value="upi" onclick="toggleDetails('upi')" checked>
                    <i class="fab fa-google-pay"></i>
                    <span>UPI (Google Pay / PhonePe)</span>
                </label>
                <div id="details-upi" class="details-area" style="display: block;">
                    <input type="text" name="upi_id" placeholder="Enter UPI ID (e.g., username@bank)">
                </div>
            </div>

            <div class="method-card" id="card-card">
                <label class="method-label">
                    <input type="radio" name="payment_method" value="card" onclick="toggleDetails('card')">
                    <i class="far fa-credit-card"></i>
                    <span>Credit / Debit Card</span>
                </label>
                <div id="details-card" class="details-area">
                    <input type="text" placeholder="Card Number" maxlength="16" style="margin-bottom: 10px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="MM/YY" maxlength="5">
                        <input type="text" placeholder="CVV" maxlength="3">
                    </div>
                </div>
            </div>

            <div class="method-card" id="card-netbanking">
                <label class="method-label">
                    <input type="radio" name="payment_method" value="netbanking" onclick="toggleDetails('netbanking')">
                    <i class="fas fa-university"></i>
                    <span>Net Banking</span>
                </label>
                <div id="details-netbanking" class="details-area">
                    <select name="bank_name">
                        <option value="">Select your Bank</option>
                        <option value="SBI">State Bank of India</option>
                        <option value="ICICI">ICICI Bank</option>
                        <option value="HDFC">HDFC Bank</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="processPayment()">
                Pay Securely
            </button>
        </form>

        <a href="{% url 'installation_history' %}" class="cancel-link">Cancel and return</a>
    </div>
</div>

<script>
    // 1. FIXED: Run historical state prevention IMMEDIATELY when the page loads
    // This locks the history layer right away, preventing early back-button manipulation
    (function initHistoryLock() {
        window.history.pushState(null, "", window.location.href);
        window.onpopstate = function() {
            window.history.pushState(null, "", window.location.href);
            alert("Payment transaction in progress. Please use 'Cancel and return' below if you wish to exit.");
        };
    })();

    function toggleDetails(method) {
        // Hide processing inputs and drop active border status tracking classes
        document.querySelectorAll('.details-area').forEach(div => div.style.display = 'none');
        document.querySelectorAll('.method-card').forEach(card => card.classList.remove('active-method'));
        
        // Expose designated selection container
        document.getElementById('details-' + method).style.display = 'block';
        document.getElementById('card-' + method).classList.add('active-method');
    }

    function processPayment() {
        const form = document.getElementById('paymentForm');
        const method = form.payment_method.value;

        // 2. Form validation checks
        if (method === 'upi' && !form.upi_id.value.trim()) {
            alert("Please enter your UPI ID to proceed.");
            return;
        }
        
        if (method === 'netbanking' && !form.bank_name.value) {
            alert("Please pick a supporting banking core.");
            return;
        }

        // FIXED: Explicitly validate card input values before allowing a form submit event
        if (method === 'card') {
            // Find the elements scoped inside the card details layout block
            const cardDetailsDiv = document.getElementById('details-card');
            const inputs = cardDetailsDiv.querySelectorAll('input[type="text"]');
            const cardNumber = inputs[0].value.trim();
            const expiry = inputs[1].value.trim();
            const cvv = inputs[2].value.trim();

            if (!cardNumber || !expiry || !cvv) {
                alert("Please fill out all credit/debit card information fields.");
                return;
            }

            if (cardNumber.length < 12) {
                alert("Please enter a valid card number.");
                return;
            }

            if (cvv.length < 3) {
                alert("Please enter a valid CVV code.");
                return;
            }
        }

        // Trigger processing state overlay UI
        document.getElementById('loader').style.display = 'flex';

        setTimeout(() => {
            form.submit();
        }, 3000);
    }
</script>

</body>
</html>
