<div class="container mt-5">
    <div class="card shadow" style="max-width: 500px; margin: auto;">
        <div class="card-header bg-primary text-white">
            <h5>Update Schedule: Request #{{ obj.id }}</h5>
        </div>
        <div class="card-body">
            <p><strong>User:</strong> {{ obj.user.full_name }}</p>
            <p><strong>Current Date:</strong> {{ obj.preferred_date }}</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Select New Date</label>
                    <input type="date" name="new_date" class="form-control" required 
                           min="{{ date.today|date:'Y-m-d' }}">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Update Schedule</button>
                </div>
            </form>
        </div>
    </div>
</div>
